<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Processing</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 50px;
    }
    input, button {
      margin: 10px;
    }
    img {
      margin-top: 20px;
      max-width: 90%;
      height: auto;
    }
  </style>
</head>
<body>
  <h1>AWS Lambda Image Processing</h1>
  
  <label for="imageUpload">Upload an Image:</label>
  <input type="file" id="imageUpload" accept="image/*" />
  <br>
  
  <button id="processImage">Process Image</button>
  <br>
  
  <h3>Processed Image:</h3>
  <img id="processedImage" alt="Your processed image will appear here" />

  <script>
    document.getElementById('processImage').addEventListener('click', async () => {
      const fileInput = document.getElementById('imageUpload');
      
      // Check if a file is selected
      if (fileInput.files.length === 0) {
        alert('Please upload an image!');
        return;
      }

      // Read the image file as Base64
      const file = fileInput.files[0];
      const reader = new FileReader();

      reader.onload = async () => {
        const base64Image = reader.result.split(',')[1]; // Remove the data prefix

        try {
          // Send the image to the AWS Lambda function via API Gateway
          const response = await fetch('https://ftbs0qj3y7.execute-api.us-east-1.amazonaws.com/default/image_processing', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              image: base64Image,
              filename: file.name, // Use the original file name
            }),
          });

          if (!response.ok) {
            throw new Error('Failed to process the image');
          }

          const data = await response.json();

          // Get the processed image in Base64 from the Lambda response
          const processedImageBase64 = data.image_base64;

          // Display the processed image
          document.getElementById('processedImage').src = `data:image/jpeg;base64,${processedImageBase64}`;
        } catch (error) {
          console.error('Error:', error);
          alert('Image processing failed! Please try again.');
        }
      };

      reader.readAsDataURL(file);
    });
  </script>
</body>
</html>
